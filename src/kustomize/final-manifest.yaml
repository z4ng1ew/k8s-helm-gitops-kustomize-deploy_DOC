        name: rabbitmq
        ports:
        - containerPort: 5672
        - containerPort: 15672
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: my-ca-issuer
  name: app-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: session.10.174.8.95.nip.io
    http:
      paths:
      - backend:
          service:
            name: session-service
            port:
              number: 8081
        path: /
        pathType: Prefix
  - host: gateway.10.174.8.95.nip.io
    http:
      paths:
      - backend:
          service:
            name: gateway-service
            port:
              number: 8087
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - session.10.174.8.95.nip.io
    - gateway.10.174.8.95.nip.io
    secretName: wildcard-nipio-tls
