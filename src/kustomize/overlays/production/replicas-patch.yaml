apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 3





# Построчный комментарий к replicas-patch.yaml

```yaml
apiVersion: apps/v1                               # Версия API для контроллеров приложений (должна совпадать с целевым Deployment)
kind: Deployment                                  # Тип ресурса — Deployment (должен совпадать с target в kustomization.yaml)
metadata:
  name: gateway-service                           # Имя Deployment-а, на который накладывается патч (идентификатор целевого ресурса)
spec:
  replicas: 3                                     # Переопределяемое значение: увеличение количества реплик Gateway до 3 в production-окружении
```

---

# Монолог для защиты (~300 символов)

> Это strategic merge patch Kustomize — минимальный YAML-фрагмент, содержащий только изменяемые поля целевого ресурса. Файл накладывается на базовый Deployment gateway-service и переопределяет количество реплик с базового значения до трёх для production-окружения. Такой подход эффективнее полной копии манифеста: патч содержит только дельту изменений, что упрощает поддержку и снижает вероятность ошибок. Kustomize по полям metadata.name и kind находит нужный ресурс и сливает изменения, сохраняя все остальные параметры из базы. Три реплики Gateway обеспечивают высокую доступность точки входа в систему и горизонтальное масштабирование под нагрузкой.