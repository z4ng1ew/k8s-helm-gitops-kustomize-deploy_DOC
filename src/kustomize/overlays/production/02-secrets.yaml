# Построчный комментарий к Secret (Kustomize base)

```yaml
apiVersion: v1                                    # Версия API Kubernetes (core/v1) для объекта Secret
kind: Secret                                      # Тип ресурса — Secret (защищённое хранилище чувствительных данных)
metadata:
  name: app-secrets                               # Имя Secret, по которому к нему обращаются Pod'ы через secretKeyRef или envFrom
type: Opaque                                      # Тип Secret — Opaque (произвольные пользовательские данные в формате ключ-значение)
data:                                             # Раздел с данными, закодированными в Base64 (требование Kubernetes)
  POSTGRES_USER: cG9zdGdyZXM=                     # Логин пользователя БД PostgreSQL (decoded: "postgres")
  POSTGRES_PASSWORD: cG9zdGdyZXM=                 # Пароль пользователя БД PostgreSQL (decoded: "postgres")
  RABBIT_MQ_USER: Z3Vlc3Q=                        # Логин для подключения к брокеру RabbitMQ (decoded: "guest")
  RABBIT_MQ_PASSWORD: Z3Vlc3Q=                    # Пароль для подключения к RabbitMQ (decoded: "guest")
  GATEWAY_SERVICE_UUID: YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz  # UUID-идентификатор Gateway-сервиса для межсервисной аутентификации (decoded: "b51ceda2-bfa5-11eb-8529-0242ac130003")
  BOOKING_SERVICE_UUID: OTExY2NiNGMtYzA1NS0xMWViLTg1MjktMDI0MmFjMTMwMDAz  # UUID-идентификатор Booking-сервиса для идентификации источника при внутренних вызовах
```

---

# Монолог для защиты (~300 символов)

> Secret входит в базовую конфигурацию Kustomize и хранит все чувствительные данные системы: учётные записи PostgreSQL и RabbitMQ, а также UUID-идентификаторы сервисов, используемые для межсервисной аутентификации между Gateway и Booking. Тип Opaque подходит для произвольных секретов, значения закодированы в Base64 согласно требованиям Kubernetes. Хранение секретов отдельно от ConfigMap соответствует принципу разделения конфигурации и чувствительных данных. В реальных окружениях Base64 не является шифрованием, поэтому для production рекомендуется использовать решения типа Sealed Secrets, HashiCorp Vault или SOPS для шифрования содержимого перед коммитом в Git.