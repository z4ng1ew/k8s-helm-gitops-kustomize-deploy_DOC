apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None             
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: postgres        
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      containers:
        - name: postgres
          image: src-postgres:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: manual
        resources:
          requests:
            storage: 5Gi







# Построчный комментарий к Service и StatefulSet PostgreSQL (Kustomize base)

```yaml
apiVersion: v1                                    # Версия API Kubernetes (core/v1) для Service
kind: Service                                     # Тип ресурса — Service (сетевая абстракция для доступа к Pod'ам)
metadata:
  name: postgres                                  # Имя сервиса (по нему другие сервисы обращаются к БД)
  labels:
    app: postgres                                 # Метка для идентификации сервиса
spec:
  clusterIP: None                                 # Headless Service — без виртуального IP, DNS возвращает IP конкретных Pod'ов (требуется для StatefulSet)
  selector:
    app: postgres                                 # Селектор: сервис направляет трафик на Pod'ы с меткой app=postgres
  ports:
    - port: 5432                                  # Порт, на котором Service принимает трафик
      targetPort: 5432                            # Порт контейнера, куда пробрасывается трафик
---
apiVersion: apps/v1                               # Версия API для контроллеров приложений
kind: StatefulSet                                 # StatefulSet — контроллер для stateful-приложений (БД, очереди) со стабильной идентичностью Pod'ов
metadata:
  name: postgres                                  # Имя StatefulSet
  labels:
    app: postgres                                 # Метка приложения
spec:
  serviceName: postgres                           # Имя headless-сервиса для DNS-идентификации Pod'ов (postgres-0.postgres)
  replicas: 1                                     # Количество реплик БД (одна, без репликации PostgreSQL)
  selector:
    matchLabels:
      app: postgres                               # Селектор Pod'ов, которыми управляет StatefulSet
  template:                                       # Шаблон создаваемых Pod'ов
    metadata:
      labels:
        app: postgres                             # Метки Pod'ов (должны совпадать с селектором)
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-master        # Pod'ы запускаются только на узле k3s-master (там, где находится PV с hostPath)
      containers:
        - name: postgres                          # Имя контейнера внутри Pod'а
          image: src-postgres:latest              # Кастомный Docker-образ PostgreSQL с предустановленными БД микросервисов
          imagePullPolicy: Never                  # Использовать только локальный образ (актуально для k3s без registry)
          ports:
            - containerPort: 5432                 # Порт, который слушает PostgreSQL внутри контейнера
          env:                                    # Переменные окружения для инициализации БД
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }      # Логин БД из Secret
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }  # Пароль БД из Secret
            - name: POSTGRES_DB
              value: postgres                     # Имя создаваемой по умолчанию базы данных
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata  # Путь хранения данных (поддиректория для совместимости с volumeMount)
          volumeMounts:
            - name: postgres-storage              # Монтируемый том (создаётся через volumeClaimTemplates)
              mountPath: /var/lib/postgresql/data # Точка монтирования в контейнере (стандартный путь для PostgreSQL)
  volumeClaimTemplates:                           # Шаблон автоматического создания PVC для каждой реплики StatefulSet
    - metadata:
        name: postgres-storage                    # Имя PVC (используется в volumeMounts)
      spec:
        accessModes: [ReadWriteOnce]              # Режим доступа: чтение/запись с одного узла
        storageClassName: manual                  # Класс хранилища — связь с заранее созданным PV
        resources:
          requests:
            storage: 5Gi                          # Запрашиваемый объём — 5Gi (соответствует созданному PV)
```

---

# Монолог для защиты (~300 символов)

> Для PostgreSQL в базовой конфигурации Kustomize я использовал StatefulSet, поскольку база данных — stateful-приложение, требующее стабильной сетевой идентичности и постоянного хранилища. Headless Service с clusterIP: None обеспечивает уникальные DNS-имена для каждого Pod'а вида postgres-0.postgres. Через volumeClaimTemplates автоматически создаётся PVC, связывающийся с PV на узле k3s-master через storageClassName: manual и nodeSelector. Учётные данные пробрасываются из Secret через secretKeyRef. Кастомный образ src-postgres:latest содержит предустановленные базы для всех микросервисов (users_db, hotels_db, reservations_db и т.д.), реализуя паттерн Database per Service.