apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hotel-service }
  template:
    metadata:
      labels: { app: hotel-service }
    spec:
      containers:
        - name: hotel-service
          image: src-hotel-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }
            - name: POSTGRES_DB
              value: hotels_db
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  selector: { app: hotel-service }
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP










# Построчный комментарий к Deployment и Service hotel-service (Kustomize base)

```yaml
apiVersion: apps/v1                               # Версия API для контроллеров приложений
kind: Deployment                                  # Тип ресурса — Deployment (stateless-приложение)
metadata:
  name: hotel-service                             # Имя Deployment
  labels: { app: hotel-service }                  # Метка для идентификации
spec:
  replicas: 1                                     # Количество реплик (одна в базовой конфигурации)
  selector:
    matchLabels: { app: hotel-service }           # Селектор Pod'ов, которыми управляет Deployment
  template:                                       # Шаблон создаваемых Pod'ов
    metadata:
      labels: { app: hotel-service }              # Метки Pod'ов (должны совпадать с селектором)
    spec:
      containers:
        - name: hotel-service                     # Имя контейнера внутри Pod'а
          image: src-hotel-service:latest         # Локально собранный Docker-образ сервиса
          imagePullPolicy: Never                  # Использовать только локальный образ (актуально для k3s без registry)
          ports:
            - containerPort: 8082                 # Порт, на котором приложение слушает внутри контейнера
          env:                                    # Переменные окружения для подключения к БД
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_HOST } }    # Хост БД из ConfigMap
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: app-config, key: POSTGRES_PORT } }    # Порт БД из ConfigMap
            - name: POSTGRES_DB
              value: hotels_db                    # Имя базы данных сервиса отелей (хранит отели и номера)
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }      # Логин БД из Secret
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }  # Пароль БД из Secret
---
apiVersion: v1                                    # Версия API Kubernetes для Service
kind: Service                                     # Тип ресурса — Service (сетевая абстракция для Pod'ов)
metadata:
  name: hotel-service                             # Имя сервиса (по нему обращаются другие микросервисы через DNS)
  labels: { app: hotel-service }                  # Метка сервиса
spec:
  selector: { app: hotel-service }                # Селектор: направляет трафик на Pod'ы с меткой app=hotel-service
  ports:
    - port: 8082                                  # Порт Service (внешний для других Pod'ов)
      targetPort: 8082                            # Порт контейнера, куда пробрасывается трафик
  type: ClusterIP                                 # Тип ClusterIP — доступ только внутри кластера
```

---

# Монолог для защиты (~300 символов)

> Hotel-service в базовой конфигурации Kustomize реализует функционал управления отелями и номерами: получение списка, поиск свободных мест, информацию по конкретному отелю. Это stateless-сервис, поэтому развёрнут как Deployment с возможностью горизонтального масштабирования через изменение replicas в overlay'ях. Сервис хранит данные в отдельной БД hotels_db, реализуя паттерн Database per Service, что обеспечивает слабую связанность микросервисов и независимое развитие каждого из них. Конфигурация подключения берётся из ConfigMap, секреты — из Secret. Service типа ClusterIP делает сервис доступным только внутри кластера через DNS hotel-service:8082, обращения извне возможны только через Gateway.