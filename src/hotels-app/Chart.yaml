apiVersion: v2
name: hotels-app
description: Helm chart for Hotels microservices application (DO12)
type: application
version: 0.2.0
appVersion: "1.0.0"







# Построчный комментарий к Chart.yaml

```yaml
apiVersion: v2                                    # Версия API Helm-чарта (v2 — современный формат для Helm 3 с поддержкой зависимостей в Chart.yaml)
name: hotels-app                                  # Имя чарта (используется при установке: helm install <release> hotels-app)
description: Helm chart for Hotels microservices application (DO12)  # Краткое описание назначения чарта
type: application                                 # Тип чарта — application (обычное приложение, разворачиваемое в кластере); альтернатива — library
version: 0.2.0                                    # Версия самого чарта (SemVer); инкрементируется при изменении манифестов
appVersion: "1.0.0"                               # Версия упаковываемого приложения (микросервисов); информационное поле, отображается в helm list
```

---

# Монолог для защиты (~300 символов)

> Файл Chart.yaml — это метаданные Helm-чарта, определяющие его как единый пакет для развёртывания всей системы микросервисов. Я использовал apiVersion v2, актуальный для Helm 3, тип application соответствует разворачиваемому приложению. Поле version описывает версию самого чарта и инкрементируется при изменении манифестов, а appVersion фиксирует версию приложения. Такой подход обеспечивает версионирование инфраструктурного кода, упрощает откаты через helm rollback и поддерживает CI/CD-процессы.