# Построчный комментарий к Secret

```yaml
apiVersion: v1                                    # Версия API Kubernetes (core/v1) для объекта Secret
kind: Secret                                      # Тип ресурса — Secret (хранилище чувствительных данных: пароли, токены, ключи)
metadata:                                         # Блок метаданных объекта
  name: app-secrets                               # Имя Secret, по которому к нему обращаются Pod'ы через envFrom или env.valueFrom
type: Opaque                                      # Тип Secret — Opaque (произвольные пользовательские данные в формате ключ-значение)
data:                                             # Раздел с зашифрованными в Base64 данными (Kubernetes требует именно Base64-кодировку)
  POSTGRES_USER: cG9zdGdyZXM=                     # Логин пользователя БД PostgreSQL (decoded: "postgres")
  POSTGRES_PASSWORD: cG9zdGdyZXM=                 # Пароль пользователя БД PostgreSQL (decoded: "postgres")
  RABBIT_MQ_USER: Z3Vlc3Q=                        # Логин для подключения к брокеру RabbitMQ (decoded: "guest")
  RABBIT_MQ_PASSWORD: Z3Vlc3Q=                    # Пароль для подключения к RabbitMQ (decoded: "guest")
  GATEWAY_SERVICE_UUID: YjUxY2VkYTItYmZhNS0xMWViLTg1MjktMDI0MmFjMTMwMDAz  # UUID-идентификатор Gateway-сервиса для межсервисной аутентификации (decoded: "b51ceda2-bfa5-11eb-8529-0242ac130003")
  BOOKING_SERVICE_UUID: OTExY2NiNGMtYzA1NS0xMWViLTg1MjktMDI0MmFjMTMwMDAz  # UUID-идентификатор Booking-сервиса (используется для идентификации источника при внутренних вызовах)
```

---

# Монолог для защиты (~300 символов)

> Чувствительные данные я вынес в отдельный объект Kubernetes Secret `app-secrets` типа Opaque. В нём хранятся учётные записи PostgreSQL и RabbitMQ, а также UUID-идентификаторы сервисов, необходимые для межсервисной аутентификации. Значения закодированы в Base64, что является требованием Kubernetes. Такой подход отделяет секреты от конфигурации, повышает безопасность и позволяет монтировать их в Pod'ы как переменные окружения через `envFrom`, не храня пароли в исходном коде или образах.